<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />

      name="description"

    <!-- Icons and link previews from the beaver sprite (npm run brand, specs/04-pages.md). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alvin Reihansyah Makarim · Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer focused on reliable backend systems. Works with Node.js, React, and PostgreSQL, with production deployment experience on AWS and Google Cloud."
    />
    <meta property="og:url" content="https://alvinreihans.web.id/" />

    <meta property="og:locale:alternate" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Sets the theme before first paint so there is no flash of the wrong theme.
      // Same rules as src/theme/theme.ts: saved choice, then the system preference, then Day.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          saved === 'day' || saved === 'night' ? saved : prefersDark ? 'night' : 'day';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
